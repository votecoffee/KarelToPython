name: GUI checks (manual)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      KAREL2PY_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Native tests with virtual display
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -X faulthandler -m unittest discover -s tests -p test_gui.py
          xvfb-run -a python -X faulthandler -m unittest discover -s tests -p test_editor.py
      - name: Native tests with Windows desktop
        if: runner.os == 'Windows'
        run: |
          python -X faulthandler -m unittest discover -s tests -p test_gui.py
          python -X faulthandler -m unittest discover -s tests -p test_editor.py
