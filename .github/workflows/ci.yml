name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Test with virtual desktop
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.destroy()"
          xvfb-run -a python -X faulthandler -m unittest discover -s tests
      - name: Test with native desktop
        if: runner.os == 'Windows'
        run: |
          python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.destroy()"
          python -X faulthandler -m unittest discover -s tests
      - run: python tools/run_examples.py
      - run: python tools/check_repository.py
