name: Tests (manual)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Test CLI and runtime without opening windows
        env:
          KAREL2PY_GUI_TESTS: '0'
        run: python -X faulthandler -m unittest discover -s tests
      - run: python tools/run_examples.py
      - run: python tools/check_repository.py
