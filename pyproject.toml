[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karel2py"
dynamic = ["version"]
description = "Fail-closed KAREL source to Python translator prototype"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/votecoffee/KarelToPython"
Issues = "https://github.com/votecoffee/KarelToPython/issues"

[project.scripts]
karel2py = "karel2py.__main__:main"

[project.gui-scripts]
karel2py-gui = "karel2py.gui:main"

[tool.setuptools.packages.find]
include = ["karel2py*"]

[tool.setuptools.dynamic]
version = {attr = "karel2py.__version__"}

[tool.setuptools.package-data]
karel2py = ["assets/icons/*.png"]
